t:space-between;margin:28px 0 16px}.results-head h2{font-size:19px;margin:0}.results-head span{color:#89988d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e6ebe4;border-radius:14px;padding:20px;display:flex;flex-direction:column;min-height:166px;box-shadow:0 3px 16px #233d2910}.card-top{display:flex;align-items:center;justify-content:space-between}.badge{font-size:12px;background:#edf4ee;color:#4b8065;padding:5px 9px;border-radius:6px}.star{font-size:23px;line-height:1;color:#a3b0a5;background:none;border:0;padding:1px 4px}.star.on{color:#d29a37}.card h3{font-size:16px;line-height:1.55;margin:18px 0 20px;font-weight:700;flex:1}.card-bottom{display:flex;justify-content:space-between;align-items:center;color:#a0ada2;font-size:12px}.actions{display:flex;gap:8px}.action{border:1px solid #e3eae2;border-radius:8px;background:#fff;padding:7px 11px;color:#4a6253;font-size:13px}.action.primary{background:#285f4a;color:white;border-color:#285f4a}.action:hover{filter:brightness(.95)}.empty{background:white;border:1px dashed #ccd8cd;border-radius:14px;text-align:center;color:#7b8b7d;padding:65px 20px;grid-column:1/-1;line-height:1.8}dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 15px 55px #172a2040;color:#25342e}dialog::backdrop{background:#17291f88}.modal{padding:26px}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:15px}.modal h2{font-size:21px;line-height:1.5;margin:14px 0}.close{border:0;background:#f0f4ef;border-radius:8px;font-size:20px;width:34px;height:34px}.prompt-text{background:#f4f7f3;border-radius:10px;padding:18px;line-height:1.8;white-space:pre-wrap}.modal-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#819186;font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#233e30;color:white;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:760px){.shell{padding:24px 18px 45px}.topnote{display:none}.hero{padding:40px 0 24px}.layout{grid-template-columns:1fr;gap:18px}.sidebar{overflow:auto}.categories{display:flex;width:max-content}.category{gap:8px}.side-title{margin-bottom:8px}.hint{display:none}.grid{grid-template-columns:1fr}.searchbar{flex-wrap:wrap}.fav-filter{padding:12px}.searchwrap{min-width:210px}}
/* 以模板圖庫為核心的視覺設計 */
:root{color:#182b42;background:#fff;font-family:Inter,"Microsoft JhengHei",sans-serif}body{background:#fff}.shell{max-width:none;padding:0 0 70px}.top{height:76px;max-width:1280px;margin:auto;padding:0 32px;border-bottom:0}.brand{font-size:18px;letter-spacing:-.02em;color:#142f51}.logo{background:#2868df;border-radius:9px}.topnote{font-size:13px;color:#65758b;letter-spacing:.04em}.hero{padding:75px 24px 76px;text-align:center;background:#edf5ff}.eyebrow{color:#3267c4;letter-spacing:.15em;font-size:12px}.hero h1{color:#132b4c;font-size:clamp(34px,4.5vw,58px);line-height:1.18;margin:15px 0 18px}.hero p{color:#60728b;font-size:16px}.hero-link{display:inline-block;background:#2868df;color:#fff;text-decoration:none;border-radius:6px;padding:15px 24px;margin-top:28px;font-weight:700;font-size:14px}.hero-link:hover{background:#1857c5}.layout{max-width:1280px;margin:0 auto;padding:52px 32px 0;grid-template-columns:210px minmax(0,1fr);gap:35px}.side-title{color:#172f4c;font-size:15px;letter-spacing:0}.category{color:#67778a;border-radius:6px;padding:11px 12px;font-size:14px}.category:hover,.category.active{background:#edf4ff;color:#245fcd}.count{color:#99a7b9}.hint{background:#f2f6fc;border-radius:8px;color:#718198}.search{border-color:#dce5f0;border-radius:7px;padding-top:14px;padding-bottom:14px}.search:focus{border-color:#427ee7;box-shadow:0 0 0 3px #dce9ff}.fav-filter{border-color:#dce5f0;border-radius:7px;color:#536b85}.fav-filter.active{background:#2868df;border-color:#2868df}.results-head{margin:32px 0 20px}.results-head h2{font-size:24px;color:#172f4c}.results-head span{color:#8292a5}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{padding:0;overflow:hidden;min-height:238px;border:1px solid #e0e7f0;border-radius:8px;box-shadow:0 4px 18px #152e4d0b;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #152e4d18}.card-top{background:#edf4ff;min-height:68px;padding:16px 18px}.card:nth-child(4n+2) .card-top{background:#fff2e9}.card:nth-child(4n+3) .card-top{background:#edf7f5}.card:nth-child(4n+4) .card-top{background:#f5f0fb}.badge{background:#fff;color:#45698e;border-radius:4px;font-size:12px}.star{color:#9aacbf}.star.on{color:#e1a12f}.card h3{color:#19324f;font-size:16px;line-height:1.6;padding:0 18px;margin:20px 0;min-height:54px}.card-bottom{padding:14px 18px;border-top:1px solid #edf1f6;color:#9aa9b8}.action{border-color:#dce5f0;border-radius:5px;color:#44617f}.action.primary{background:#2868df;border-color:#2868df}.action:hover{filter:brightness(.94)}dialog{color:#19324f}.prompt-text{background:#f1f6fd}.close{background:#edf4ff}.toast{background:#183958}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.top{height:64px;padding:0 20px}.hero{padding:55px 20px}.layout{padding:30px 18px 0;grid-template-columns:1fr;gap:18px}.results-head{margin-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card h3{font-size:15px}.card-bottom{padding:12px}.actions{gap:4px}.action{padding:7px 8px}.hint{display:none}}@media(max-width:480px){.grid{grid-template-columns:1fr}.card{min-height:205px}.hero h1{font-size:34px}.results-head h2{font-size:21px}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><span class="logo">✳</span> 提示詞工作台</div><div class="topnote">提示詞圖庫 &nbsp; / &nbsp; 為你的工作找到好起點</div></header>
<section class="hero"><div class="eyebrow">PROMPT LIBRARY</div><h1>讓好想法，<br>從一個好問題開始。</h1><p>探索適合各種工作情境的 AI 提示詞，找到靈感，輕鬆開始。</p><a class="hero-link" href="#library">瀏覽所有提示詞 ↓</a></section>
<div class="layout" id="library"><aside class="sidebar"><p class="side-title">瀏覽分類</p><nav class="categories" id="categories" aria-label="提示詞分類"></nav><div class="hint">✦ &nbsp;小提示<br>搭配具體背景與素材，讓 AI 更了解你的需求。</div></aside>
<main><div class="searchbar"><label class="searchwrap"><span aria-hidden="true">⌕</span><input class="search" id="search" type="search" placeholder="搜尋提示詞或類別，例如：會議、摘要…" aria-label="搜尋提示詞或類別"></label><button class="fav-filter" id="favFilter" aria-pressed="false">☆ 只看收藏</button></div><div class="results-head"><h2 id="heading">全部提示詞</h2><span id="resultCount" aria-live="polite"></span></div><div class="grid" id="grid"></div></main></div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="modal"><div class="modal-head"><div><span class="badge" id="dialogCategory"></span><h2 id="dialogTitle"></h2></div><button class="close" id="closeDialog" aria-label="關閉">×</button></div><div class="prompt-text" id="dialogText"></div><div class="modal-bottom"><span id="dialogSource"></span><button class="action primary" id="dialogCopy">複製提示詞</button></div></div></dialog><div class="toast" id="toast" role="status"></div>
<script src="prompts.js"></script><script>
(()=>{'use strict';
const prompts=window.PROMPTS; const $=id=>document.getElementById(id); const key='prompt-workbench-favorites-v1'; let favorites=new Set(); try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved)) favorites=new Set(saved)}catch{} let category='全部';let onlyFavorites=false;let current=null;let timer;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function renderCategories(){const names=['全部',...new Set(prompts.map(p=>p.category))];$('categories').innerHTML=names.map(name=>{const count=name==='全部'?prompts.length:prompts.filter(p=>p.category===name).length;return `<button class="category ${category===name?'active':''}" data-category="${escapeHTML(name)}" ${category===name?'aria-current="true"':''}><span>${escapeHTML(name)}</span><span class="count">${count}</span></button>`}).join('')}
function render(){renderCategories();const q=$('search').value.trim().toLocaleLowerCase();const filtered=prompts.filter(p=>(category==='全部'||p.category===category)&&(!onlyFavorites||favorites.has(p.id))&&(!q||`${p.text} ${p.category} ${p.source} ${p.id}`.toLocaleLowerCase().includes(q)));$('heading').textContent=category==='全部'?'全部提示詞':category;$('resultCount').textContent=`${filtered.length} 條結果`;$('favFilter').classList.toggle('active',onlyFavorites);$('favFilter').setAttribute('aria-pressed',String(onlyFavorites));$('favFilter').textContent=onlyFavorites?'★ 只看收藏':'☆ 只看收藏';$('grid').innerHTML=filtered.length?filtered.map(p=>`<article class="card"><div class="card-top"><span class="badge">${escapeHTML(p.category)}</span><button class="star ${favorites.has(p.id)?'on':''}" data-star="${p.id}" aria-label="${favorites.has(p.id)?'取消收藏':'加入收藏'}：${escapeHTML(p.text)}" aria-pressed="${favorites.has(p.id)}">${favorites.has(p.id)?'★':'☆'}</button></div><h3>${escapeHTML(p.text)}</h3><div class="card-bottom"><span>NO. ${String(p.id).padStart(3,'0')}</span><div class="actions"><button class="action" data-view="${p.id}">查看</button><button class="action primary" data-copy="${p.id}">複製</button></div></div></article>`).join(''):'<div class="empty">找不到符合條件的提示詞。<br>試試其他關鍵字或切換分類。</div>'}
async function copy(p){try{if(!navigator.clipboard||!window.isSecureContext)throw Error();await navigator.clipboard.writeText(p.text);notice('已複製提示詞')}catch{showDialog(p);notice('無法自動複製，請選取內容後手動複製')}}
function showDialog(p){current=p;$('dialogCategory').textContent=p.category;$('dialogTitle').textContent=`提示詞 ${String(p.id).padStart(3,'0')}`;$('dialogText').textContent=p.text;$('dialogSource').textContent=`來源：${p.source}`;if(!$('dialog').open)$('dialog').showModal()}
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;render()}});$('search').addEventListener('input',render);$('favFilter').addEventListener('click',()=>{onlyFavorites=!onlyFavorites;render()});$('grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.star||b.dataset.view||b.dataset.copy);const p=prompts.find(x=>x.id===id);if(!p)return;if(b.dataset.star){favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem(key,JSON.stringify([...favorites]));notice(favorites.has(id)?'已加入收藏':'已取消收藏')}catch{notice('無法儲存收藏，請檢查瀏覽器設定')}render()}else if(b.dataset.view)showDialog(p);else copy(p)});$('closeDialog').addEventListener('click',()=>$('dialog').close());$('dialogCopy').addEventListener('click',()=>current&&copy(current));render();})();
</script></body></html>
